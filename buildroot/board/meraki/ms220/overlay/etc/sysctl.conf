# postmerkOS console log level.
#
# The binary Vitesse/Click datapath polls the 10G PHYs on the SFP+ cages and,
# on models where those PHYs are not fully driven by the donor modules (e.g.
# MS320-24P uplink ports 24-27), emits a per-second flood of
#   chatter: [sw0_ctrl :: VitesseController] Failed to read CPU PHY GPIO ...
# at KERN_ALERT. With the default console log level (7) this makes the serial
# console unusable. Lower the console log level so only KERN_EMERG reaches the
# console; everything is still recorded in the kernel ring buffer (read with
# `dmesg`). Applied early at boot by the sysctl init, before the Click datapath
# starts, so a freshly flashed device boots quietly.
#
# Fields: console_loglevel default_message_loglevel minimum_console_loglevel default_console_loglevel
kernel.printk = 1 4 1 7
